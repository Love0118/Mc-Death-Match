name: SniperPvp
version: '1.0.0'
main: kr.sniperpvp.SniperPvpPlugin
api-version: '26.2'
load: STARTUP
description: 300x300 hitscan sniper PvP for Paper 26.2.
author: Jaeyun
commands:
  sniper:
    aliases: [sni, snp]
    description: Sniper PvP administration command.
    usage: /sniper <start|stop|give|debug|spawn|status|reload>
    permission: sniperpvp.admin
permissions:
  sniperpvp.admin:
    description: Allows management of the Sniper PvP game.
    default: op

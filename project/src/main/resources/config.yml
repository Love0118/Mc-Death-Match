arena:
  world-name: sniper_arena
  auto-build: true
  teleport-on-join: true

game:
  auto-start: false
  clear-inventory-on-equip: true
  kill-limit: 40
  match-duration-seconds: 600
  respawn-delay-seconds: 3
  spawn-protection-ticks: 20
  restart-delay-seconds: 12
  # Final attribute values while participating in a match, not additive bonuses.
  movement-speed: 0.25
  jump-strength: 0.72
  player-scale: 1.5
  max-health: 100.0
  # Refilled only when a life starts; normal regeneration never restores this shield.
  absorption: 50.0
  regeneration:
    combat-delay-seconds: 5
    interval-seconds: 1
    amount: 5.0
  end-slow-motion:
    tick-rate: 2.0
    duration-seconds: 7

hud:
  enabled: true
  # Six cards are arranged 3-vs-3 around the centered timer. TAB always contains everybody.
  max-visible-players: 6
  update-interval-ticks: 5
  show-tab-scores: true
  max-kill-banners: 3
  kill-banner-duration-ticks: 60
  max-kill-log-entries: 5
  kill-log-duration-ticks: 100

rifle:
  custom-model-data: 1001
  item-model: jm:walnut_longline_mk2
  range: 350.0
  # Expand player hitboxes by this many blocks for hitscan targeting.
  hitbox-expansion: 0.20
  # Maximum tangent spread while hip-firing: 0.05 is about 5 blocks of offset per 100 blocks.
  unscoped-spread: 0.05
  # Fixed horizontal hitscan offset in blocks. Positive moves the ray right; negative moves it left.
  # /sni reload applies this immediately without restarting the server.
  horizontal-aim-offset-blocks: 0.03
  cooldown-ticks: 30
  magazine-size: 5
  reload-ticks: 90
  bolt-sound-delay-ticks: 14
  zoom-slowness-amplifier: 12
  require-zoom: false
  damage:
    legs: 70.0
    body: 100.0
    head: 150.0
    leg-height-ratio: 0.375
    head-height-ratio: 0.75
  tracer:
    enabled: true
    spacing: 0.75

debug:
  # /sni debug reads this catalog into a paginated model-selection GUI.
  # Add an item-model resource and one entry here to expose another selectable gun.
  rifle-models:
    - id: ak47
      display-name: AK-47
      item-model: jm:ak47
      custom-model-data: 1001
    - id: walnut_longline_mk2
      display-name: Walnut Longline Mk2
      item-model: jm:walnut_longline_mk2
      custom-model-data: 1001

sounds:
  zoom-in: minecraft:item.spyglass.use
  zoom-out: minecraft:item.spyglass.stop_using
  fire: sniperpvp:rifle.fire
  bolt: sniperpvp:rifle.bolt
  reload: sniperpvp:rifle.reload
  empty: minecraft:block.lever.click
  # Private headshot confirmation; body and leg hits do not play this cue.
  hit: entity.arrow.hit_player
  zoom-volume: 0.65
  fire-volume: 3.0
  mechanical-volume: 1.0
  hit-volume: 0.8
  fire-pitch: 0.9
  bolt-pitch: 1.0

match-result-sounds:
  victory: sniperpvp:match.victory
  defeat: sniperpvp:match.defeat
  volume: 1.0
  pitch: 1.0

kill-streak:
  enabled: true
  sound-prefix: sniperpvp:kill.
  # Let the gunshot transient pass before the private cue, and play it before the 14-tick bolt sound.
  play-delay-ticks: 4
  volume: 1.0
  pitch: 1.0

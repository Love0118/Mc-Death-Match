enabled: true
publish-on-startup: true

resource-packs:
  directory: resourcepacks
  # Deliberately does not match a mapped file; this project builds every ZIP explicitly.
  bundled-file: unused-bundled-pack.zip
  versions:
    - version: '1.21.8'
      file: sniper-pvp-1.21.8.zip
    - versions: ['1.21.9', '1.21.10']
      file: sniper-pvp-1.21.9-1.21.10.zip
    - version: '1.21.11'
      file: sniper-pvp-1.21.11.zip
    - versions: ['26.1', '26.1.1', '26.1.2']
      file: sniper-pvp-26.1.x.zip
    - version: '26.2'
      file: sniper-pvp-26.2.zip

archive:
  max-bytes: 157286400
  max-uncompressed-bytes: 536870912
  max-entries: 50000

dropbox:
  enabled: false
  # Blank values use the upstream plugin's public rclone OAuth application.
  # The refresh token is written only to the ignored runtime config after /darp dropbox finish.
  app-key: ''
  app-secret: ''
  redirect-uri: ''
  refresh-token: ''
  directory: /sniper-pvp-resource-packs

delivery:
  on-join: true
  join-delay-ticks: 20
  resend-online-on-publish: true
  required: true
  prompt: 저격 PvP 전용 리소스팩을 적용해야 접속할 수 있습니다.
